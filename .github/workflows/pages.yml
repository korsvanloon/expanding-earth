name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deployment write to Pages, and never run two at once.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The reconstruction, if this exact set of inputs has been solved before.
      #
      # It is not committed -- 22 MB a run, and measured on two real versions
      # git stores about 5.9 MB for each one with no delta compression between
      # them at all, because the frames are byte-split differences and a model
      # change moves nearly every byte. Committing it would grow the repository
      # by roughly 7.5 MB per shipped change, permanently, and every clone and
      # every CI checkout would pay for the whole history of runs.
      #
      # Caching it costs nothing and answers the same complaint. The key is a
      # hash of everything the pipeline reads: the solver and the shared code,
      # the age and height maps, and the datasets in data-src. A change to
      # anything under src/ -- which is most days -- now deploys without
      # solving. A change to the solver misses, and pays the four minutes,
      # which is correct: the run really is different.
      - uses: actions/cache@v4
        with:
          path: |
            public/data
            .stage
          key: >-
            data-${{ hashFiles('tools/**/*.ts', 'shared/**/*.ts',
            'public/textures/age-map.png', 'public/textures/height-map.jpg',
            'data-src/**') }}


      - run: pnpm typecheck
      - run: pnpm test

      # `pnpm build` regenerates the reconstruction from the textures and the
      # crustal model in the repository before bundling. That is two hundred
      # one-million-year steps over eighty thousand triangles, eighty relaxation
      # sweeps each: ten minutes on this runner. Nothing is fetched from the
      # network.
      #
      # It deliberately does *not* rewrite the documents the way `pnpm data`
      # does. It used to, and that made the check below vacuous: the build
      # refilled MODEL.md's generated tables from whatever it had just
      # computed, so the committed numbers were compared against themselves
      # and a document quoting a different run than the one being deployed
      # passed every time. It happened -- the whole fold was written up,
      # committed and shipped while the run on the site was still the collapse,
      # because the solver's default lived in an environment variable that only
      # a local shell ever set.
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Again, now that there is a run to check. Every test that reads
      # public/data is written as "if the data is there", and on a fresh
      # checkout it is not -- so the pass above skips exactly the checks that
      # would catch a bad build: the documents matching the run they quote, the
      # mesh agreeing with its own header, the fabric raster covering the globe.
      # It costs five seconds and it is the only place those ever run.
      - run: pnpm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
