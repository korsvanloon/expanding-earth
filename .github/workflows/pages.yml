name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deployment write to Pages, and never run two at once.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The reconstruction, solved somewhere else.
      #
      # **Nothing is solved here.** A run is made on the machine where it was
      # measured and published to a store (tools/publish-run.ts); this restores
      # it, and the rest of this job is the app being built around it. That is
      # the whole of the arrangement, and it is why there are no caches left in
      # this file: there is nothing expensive to cache.
      #
      # It used to solve, as a fallback, so that a forgotten publish cost ten
      # minutes rather than a red build. That fallback was never reached and
      # could not be: `pnpm test` runs first and compares the documents against
      # the run that was restored, so a forgotten publish failed the job before
      # anything could solve its way out of it -- which is exactly how it failed
      # on the day the corrections came out of the solver. A fallback that
      # cannot run is not a safety net, it is eight minutes of runner that has
      # to be reasoned about every time somebody reads this file.
      #
      # So the rule is now the one that was already true in practice: publish
      # the run, then push. The step below says so when it is not done.
      - name: Restore the published run
        env:
          # A repository *variable* is where this belongs -- the store's URL is
          # not a secret -- but a secret of the same name is read too, since
          # that is the other place someone reasonably puts it.
          RUN_STORE: ${{ vars.RUN_STORE || secrets.RUN_STORE }}
        run: |
          set -e
          if [ -z "$RUN_STORE" ]; then
            echo "RUN_STORE is not set: it is the public URL of the store runs are"
            echo "published to. Set it as a repository variable."
            exit 1
          fi
          # --compressed throughout: a run is stored gzipped, and a JSON parser
          # handed gzip says only that the JSON is bad.
          curl -fsSL --compressed "$RUN_STORE/runs.json" -o runs.json
          id=$(node -p "JSON.parse(require('fs').readFileSync('runs.json','utf8')).default")
          node -p "JSON.parse(require('fs').readFileSync('runs.json','utf8')).runs.find((r) => r.id === '$id').files.join('\n')" > files.txt
          while read -r file; do
            mkdir -p "public/data/$(dirname "$file")"
            curl -fsSL --compressed "$RUN_STORE/runs/$id/$file" -o "public/data/$file"
          done < files.txt
          rm -f runs.json files.txt
          echo "restored $id from $RUN_STORE ($(du -sh public/data | cut -f1))"

      # And that it is the run this checkout would have produced. `inputs.sha`
      # is the hash of every input it was solved from, the solver included, so
      # a solver change that was never published stops here and says which
      # command to run, rather than deploying a site whose documents describe a
      # model the viewer is not showing.
      - run: pnpm check-run

      - run: pnpm typecheck
      - run: pnpm test

      # Just the app. `pnpm build` is `pnpm data` and then this; `pnpm data` is
      # the part that solves, and it has no business on a runner.
      - run: pnpm bundle
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Where the viewer fetches runs from, and what the run picker lists.
          # Unset, it falls back to the store's default URL; see vite.config.ts.
          RUN_STORE: ${{ vars.RUN_STORE || secrets.RUN_STORE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
