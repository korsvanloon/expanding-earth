name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deployment write to Pages, and never run two at once.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Just the app.
      #
      # The site is a viewer and nothing else: every reconstruction it shows
      # lives in the store (tools/publish-run.ts), and it fetches the list of
      # them at runtime. So nothing is solved here, nothing is restored here,
      # and publishing a run does not need a deploy -- which is the point, since
      # a solve is ten minutes on the machine that can measure it and an hour of
      # nobody's attention on a runner.
      #
      # Two earlier shapes of this file are worth not going back to. It solved
      # the run, which cost ten minutes a deploy for an answer that already
      # existed. Then it restored the published run and checked the documents
      # against it, which turned a forgotten publish into a red build -- and
      # that is what it did, twice, on the day the corrections came out of the
      # solver. The checks that read a run belong where a run is made.
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm bundle
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Which store the viewer reads, and what its run picker lists.
          # Unset, it falls back to the store's own URL; see vite.config.ts.
          RUN_STORE: ${{ vars.RUN_STORE || secrets.RUN_STORE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
